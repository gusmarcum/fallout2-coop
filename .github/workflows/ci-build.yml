name: Build

# What this fork ships is a Windows co-op server (f2_server.exe) and the viewer
# client (fallout2-ce.exe), built with MSYS2 mingw-w64 exactly as the local
# build script does. CI answers one question: does main still build the
# binaries we ship. The Linux build and the static analysis stay because they
# are cheap and GCC on Linux catches portability slips MinGW lets through.
# The upstream phone/Mac/32-bit matrix and the clang-format gate are gone:
# nothing here targets them, and a check nobody can keep green is worse than
# no check.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

# A newer push to the same branch supersedes the older run instead of queueing
# behind it, but ONLY for pull requests.
#
# On main the run always finishes. The README badge reports the last COMPLETED
# run on the default branch, and GitHub paints a cancelled run the same red as a
# failed one. Two pushes a few minutes apart therefore left a green build showing
# as "failing" on the front page until the next run happened to land. A stale
# badge is a much smaller problem than a badge that cries wolf, and pushes to main
# are rare enough that the wasted minutes do not matter.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  static-analysis:
    name: Static analysis

    runs-on: ubuntu-latest

    steps:
      - name: Install
        run: |
          sudo apt update
          sudo apt install cppcheck

      - name: Clone
        uses: actions/checkout@v4

      - name: cppcheck
        run: cppcheck --std=c++17 src/

  linux:
    name: Linux (x64)

    runs-on: ubuntu-22.04

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt update
          sudo apt install libsdl2-dev zlib1g-dev

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: out
          key: linux-x64-cmake-v3

      - name: Configure
        run: |
          cmake --preset linux-x64-debug

      - name: Build
        run: |
          cmake --build --preset linux-x64-debug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-linux-x64
          path: |
            out/build/linux-x64-debug/fallout2-ce
            out/build/linux-x64-debug/f2_server
          retention-days: 7

  windows:
    name: Windows (MinGW x64)

    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      # Same flags as the shipping build (D:\Games\f2dev-build.sh): Release,
      # fully static so the exes run on a machine without MSYS2, gnu17 for the
      # C sources.
      - name: Configure
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_FLAGS=-std=gnu17

      - name: Build
        run: |
          cmake --build build-win --target f2_server fallout2-ce -j 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-coop-windows-x64
          path: |
            build-win/f2_server.exe
            build-win/fallout2-ce.exe
          retention-days: 7
